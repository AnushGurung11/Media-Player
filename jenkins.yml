pipeline {
    agent any

    options {
        skipDefaultCheckout(false)
    }

    environment {
        DISCORD_WEBHOOK = credentials('discord-webhook')
    }

    stages {

        stage('Build & Test') {
            parallel {

                stage('Frontend - Build & Lint') {
                    agent any
                    environment {
                        VITE_SUPABASE_URL             = credentials('vite-supabase-url')
                        VITE_SUPABASE_PUBLISHABLE_KEY = credentials('vite-supabase-publishable-key')
                    }
                    steps {
                        dir('frontend') {
                            bat 'npm ci'
                            bat 'npm run lint'
                            bat 'npm run build'
                        }
                    }
                    post {
                        always {
                            script { notifyDiscord('Frontend CI', currentBuild.currentResult) }
                        }
                    }
                }
            }
        }
    }
}

def notifyDiscord(String title, String status) {
    def color = (status == 'SUCCESS') ? '3066993' : '15158332'
    bat """
        curl -H "Content-Type: application/json" -X POST -d "{\\"embeds\\": [{\\"title\\": \\"${title}\\", \\"description\\": \\"Build finished with status: ${status}\\", \\"color\\": ${color}}]}" %DISCORD_WEBHOOK%
    """
}