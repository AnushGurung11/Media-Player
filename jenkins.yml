pipeline {
    agent any

    options {
        skipDefaultCheckout(false)
    }

    environment {
        DISCORD_WEBHOOK = credentials('discord-webhook')
    }

    stages {

        stage('Build & Test') {
            parallel {

                stage('Frontend - Build & Lint') {
                    agent any
                    environment {
                        VITE_SUPABASE_URL             = credentials('vite-supabase-url')
                        VITE_SUPABASE_PUBLISHABLE_KEY = credentials('vite-supabase-publishable-key')
                    }
                    steps {
                        dir('frontend') {
                            sh 'npm ci'
                            sh 'npm run lint'
                            sh 'npm run build'
                        }
                    }
                    post {
                        always {
                            script { notifyDiscord('Frontend CI', currentBuild.currentResult) }
                        }
                    }
                }
            }
        }
    } // closes stages
} // closes pipeline  <-- this was missing

def notifyDiscord(String title, String status) {
    sh """
        curl -H "Content-Type: application/json" -X POST -d '{
            "embeds": [{
                "title": "${title}",
                "description": "Build finished with status: ${status}",
                "color": ${status == 'SUCCESS' ? '3066993' : '15158332'}
            }]
        }' \$DISCORD_WEBHOOK
    """
}